<style>
:root {
  --bg: #f2f4f6; --surface: #ffffff; --muted: #e9edf2; --ink: #121a24; --ink-2: #44515c; --ink-3: #5f6c76; --line: #d3dbe0;
  --accent: #1f4f9a; --accent-soft: #e1eaf7; --on-accent: #ffffff; --ai: #5b47b8; --ai-soft: #eeebfb;
  --good: #1c7a43; --good-soft: #e1f2e7; --warn: #a14d18; --warn-soft: #f8e9df; --crit: #b42a22; --crit-soft: #f9e3e1; --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(10,20,40,.06), 0 8px 24px rgba(10,20,40,.06);
  --fs: 125%;
  --c-good: #1c7a43; --c-ai: #5b47b8; --c-warn: #a14d18; --c-accent: #1f4f9a;
}
:root[data-theme="dark"] {
  --bg: #0f1419; --surface: #172029; --muted: #1f2a35; --ink: #eef2f5; --ink-2: #b7c2cb; --ink-3: #94a1ad; --line: #2b3843;
  --accent: #7fb0f5; --accent-soft: #1b2a40; --on-accent: #0b1a30; --ai: #a797ff; --ai-soft: #241f3f;
  --good: #52c482; --good-soft: #15301f; --warn: #f0a46c; --warn-soft: #3a2616; --crit: #ff7b72; --crit-soft: #3a1714; --focus: #6aa8f0;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --c-good: #36a263; --c-ai: #8577ea; --c-warn: #d37a40; --c-accent: #5d8fdc;
}
* { box-sizing: border-box; }
html { font-size: var(--fs); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 .8rem/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
h1, h2, h3 { font-family: "Familjen Grotesk", system-ui, sans-serif; font-weight: 600; margin: 0; line-height: 1.2; }
h1 { font-size: 1.1rem; } h2 { font-size: .9rem; } h3 { font-size: .82rem; }
.mono, code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .68rem; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; cursor: pointer; }
a.btn { text-decoration: none; display: inline-block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: .5rem .9rem; align-items: center; padding: .7rem 1.4rem; }
.brand { display: flex; align-items: center; gap: .45rem; text-decoration: none; color: var(--ink); }
.brand svg { width: 2.2rem; height: 1.5rem; } .brand b { font: 600 1.15rem "Familjen Grotesk", sans-serif; letter-spacing: -.015em; } .brand b span { color: var(--accent); }
.tabs { display: flex; flex-wrap: wrap; gap: .1rem; }
.tabs { gap: .2rem .9rem; }
.tabs a { text-decoration: none; color: var(--ink-2); padding: .25rem 0; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--ink); }
.top .tabs a { font-size: .76rem; } .top .btn, .top .switch { font-size: .72rem; } .top .pill { font-size: .6rem; }
.tabs a[aria-current="page"] { color: var(--accent); font-weight: 700; border-bottom-color: var(--accent); }
.viewmenu { position: relative; } .viewmenu summary { list-style: none; } .viewmenu summary::-webkit-details-marker { display: none; }
.viewmenu .pop { position: absolute; right: 0; top: 2.4em; background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; padding: .5rem; box-shadow: var(--shadow); display: grid; gap: .35rem; min-width: 11rem; z-index: 30; }
.spacer { flex: 1; }
.tools { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: .4rem; padding: .3rem .65rem; font-weight: 700; min-height: 2.2em; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ai { background: var(--ai); color: #fff; border-color: var(--ai); } :root[data-theme="dark"] .btn.ai { color: #120d2b; }
.btn.danger { background: var(--crit); color: #fff; border-color: var(--crit); } :root[data-theme="dark"] .btn.danger { color: #2a0705; }
.btn.small { padding: .15rem .45rem; font-size: .66rem; min-height: 0; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.switch { display: inline-flex; align-items: center; gap: .4rem; border: 0; border-radius: 99px; padding: .2rem .25rem .2rem .7rem; font-weight: 700; }
.switch.on { background: var(--good-soft); color: var(--good); } .switch.off { background: var(--crit-soft); color: var(--crit); }
.switch i { width: 2.1em; height: 1.2em; border-radius: 99px; background: currentColor; position: relative; display: inline-block; }
.switch i::after { content: ""; position: absolute; top: .15em; width: .9em; height: .9em; border-radius: 50%; background: var(--surface); transition: left .2s; }
.switch.on i::after { left: 1.05em; } .switch.off i::after { left: .15em; }
/* live bar */
.live { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem 1.6rem; padding: .55rem 1.4rem; background: var(--muted); border-bottom: 1px solid var(--line); }
.live .m small { display: block; color: var(--ink-2); font-size: .62rem; } .live .m b { font-size: .78rem; }
.livetag { display: inline-flex; align-items: center; gap: .35rem; background: var(--good-soft); color: var(--good); border-radius: 99px; padding: .15rem .55rem; font-weight: 700; font-size: .66rem; }
.livetag.off { background: var(--crit-soft); color: var(--crit); }
.dot { width: .55em; height: .55em; border-radius: 50%; background: currentColor; display: inline-block; }
.pulse { animation: pulse 1.6s infinite; } @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 .3em transparent; } }
.reduce .pulse { animation: none; }
/* layout */
main { padding: 1.2rem 1.4rem 2.5rem; max-width: 120rem; margin: 0 auto; }
.pagehead { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: flex-end; margin-bottom: .8rem; }
.pagehead .t { flex: 1 1 20rem; }
.eyebrow { font-weight: 700; font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.eyebrow.ai { color: var(--ai); } .eyebrow.accent { color: var(--accent); } .eyebrow.warn { color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; box-shadow: none; }
.card + .card { margin-top: .7rem; }
.stack > * + * { margin-top: .7rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(17rem, 100%), 1fr)); gap: .8rem; align-items: start; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(22rem, 100%), 1fr)); gap: .8rem; align-items: start; }
.side { display: grid; grid-template-columns: minmax(15rem, 18rem) minmax(0, 1fr); gap: .8rem; align-items: start; }
@media (max-width: 52rem) { .side { grid-template-columns: 1fr; } }
.pill { display: inline-flex; align-items: center; gap: .3rem; border-radius: 99px; padding: .05rem .5rem; font-weight: 700; font-size: .62rem; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.ai { background: var(--ai-soft); color: var(--ai); } .pill.accent { background: var(--accent-soft); color: var(--accent); } .pill.muted { background: var(--muted); color: var(--ink-2); }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.muted { color: var(--ink-2); } .small { font-size: .66rem; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .66rem; color: var(--ink-2); font-weight: 700; padding: .5rem .6rem; background: var(--muted); }
th:first-child { border-radius: 8px 0 0 8px; } th:last-child { border-radius: 0 8px 8px 0; }
td { padding: .6rem .6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
.scroll { overflow-x: auto; max-width: 100%; }
.grid3 > *, .grid2 > *, .side > *, .stack > * { min-width: 0; }
.grid2 > .card + .card, .grid3 > .card + .card { margin-top: 0; }
.trail dd { overflow-wrap: anywhere; }
table.wide { min-width: 44rem; }
.nw { white-space: nowrap; }
.code > .pill { align-self: start; }
/* stepper */
.stepper { display: flex; flex-wrap: wrap; gap: .6rem 0; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .8rem 1rem; }
.step { flex: 1 1 0; min-width: 7.6rem; overflow: hidden; display: flex; gap: .5rem; align-items: center; position: relative; padding-right: .6rem; }
.step:not(:last-child)::after { content: ""; flex: 1 1 1rem; min-width: .8rem; height: 2px; background: var(--good); margin-left: .3rem; }
.step.now::after, .step.next::after, .step.running::after { background: var(--line); }
.step .n { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .66rem; background: var(--muted); color: var(--ink-3); }
.step.done .n { background: var(--good-soft); color: var(--good); } .step.warn .n { background: var(--warn-soft); color: var(--warn); }
.step.now .n { background: var(--ai); color: #fff; box-shadow: 0 0 0 4px var(--ai-soft); } .step.now .mono { color: var(--ai); }
.step.running .n { background: var(--ai-soft); color: var(--ai); }
.step b { display: block; font-size: .7rem; white-space: nowrap; } .step .mono { color: var(--ink-2); font-size: .6rem; white-space: nowrap; display: block; } .step small { display: block; color: var(--ink-2); font-size: .6rem; line-height: 1.35; }
/* soap */
.sec { display: grid; grid-template-columns: 1.5rem 1fr; gap: .5rem; margin-top: .55rem; }
.sec .l { width: 1.5rem; height: 1.5rem; border-radius: .35rem; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; }
mark { background: var(--ai-soft); color: inherit; border-bottom: 2px solid var(--ai); padding: 0 .1em; border-radius: .15em; }
mark.sus { background: var(--warn-soft); border-color: var(--warn); }
mark.flash { outline: 3px solid var(--focus); }
.code { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: .5rem; padding: .55rem 0; border-bottom: 1px solid var(--line); }
.code .num { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .62rem; }
.trail { margin-top: .35rem; display: grid; grid-template-columns: max-content 1fr; gap: .1rem .6rem; font-size: .64rem; }
.trail dt { color: var(--ink-2); } .trail dd { margin: 0; }
details > summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: .66rem; }
.check { display: grid; grid-template-columns: 1.1rem 1fr; gap: .4rem; padding: .25rem 0; }
.handback { border-left: 4px solid var(--ai); }
.handback.ready { border-left-color: var(--good); }
.hb dt { font-weight: 700; font-size: .62rem; color: var(--ink-2); margin-top: .45rem; } .hb dd { margin: .1rem 0 0; }
.drop { border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: .6rem; padding: .9rem; text-align: center; }
.drop.over { background: var(--ai-soft); border-color: var(--ai); }
textarea, input[type=text], input[type=date], select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: .4rem; padding: .35rem .45rem; width: 100%; }
textarea { min-height: 8rem; font-family: "IBM Plex Mono", monospace; font-size: .66rem; }
label.f { display: block; font-weight: 700; font-size: .64rem; color: var(--ink-2); margin: .45rem 0 .15rem; }
.seg { display: inline-flex; background: var(--muted); border-radius: .5rem; padding: .15rem; gap: .15rem; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: .2rem .6rem; border-radius: .35rem; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: var(--shadow); }
.owner { display: flex; gap: .6rem; align-items: center; padding: .6rem .6rem; border-radius: 10px; width: 100%; border: 0; background: transparent; text-align: left; color: var(--ink); margin-top: .2rem; }
.owner:hover { background: var(--muted); }
.owner[aria-pressed="true"] { background: var(--accent-soft); }
.av { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; background: var(--muted); color: var(--accent); font-weight: 700; flex: none; }
.stat small { display: block; color: var(--ink-2); font-size: .62rem; } .stat b { font: 600 .9rem "Familjen Grotesk", sans-serif; }
.notes { background: var(--bg); border-radius: .45rem; padding: .5rem .6rem; margin: .2rem 0 .4rem; }
.foot { color: var(--ink-3); font-size: .62rem; margin-top: 1.2rem; }
.log { max-height: 16rem; overflow: auto; font-size: .64rem; }
.log div { padding: .2rem 0; border-bottom: 1px solid var(--line); }
.banner { padding: .5rem .7rem; border-radius: .45rem; }
.banner.warn { background: var(--warn-soft); } .banner.crit { background: var(--crit-soft); } .banner.good { background: var(--good-soft); } .banner.ai { background: var(--ai-soft); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font: 19px "Atkinson Hyperlegible", sans-serif; }
.chart text.b { fill: var(--ink); font-weight: 700; }
.fade { animation: fade .35s ease both; } .reduce .fade { animation: none; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
/* overview, after the Figma cover */
body.home .live { display: none; }
body.home main { padding: 0; max-width: none; }
.hero { position: relative; overflow: hidden; background: #0d1b33; color: #fff; min-height: calc(100vh - 3.5rem); display: flex; align-items: center; }
.glow { position: absolute; border-radius: 50%; filter: blur(110px); opacity: .55; pointer-events: none; }
.g1 { width: 46rem; height: 46rem; right: -6rem; top: -16rem; background: #5b47b8; } .g2 { width: 38rem; height: 38rem; right: 4rem; bottom: -14rem; background: #0b6b66; } .g3 { width: 34rem; height: 34rem; left: -14rem; bottom: -12rem; background: #1f4f9a; }
.hero-in { position: relative; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2rem; align-items: center; width: 100%; max-width: 92rem; margin: 0 auto; padding: 3rem 3rem 4rem; }
@media (max-width: 60rem) { .hero-in { grid-template-columns: 1fr; padding: 2rem 1.2rem 3rem; } .hero-r { display: none; } }
.appicon { width: 3.6rem; height: 3.6rem; display: block; }
.hero-eyebrow { color: #a797ff; font-weight: 700; letter-spacing: .1em; margin-top: .8rem; }
.hero-title { font-size: clamp(2rem, 4.6vw, 3.6rem); line-height: 1.08; letter-spacing: -.02em; margin: .5rem 0 0; color: #fff; }
.hero-line { font-size: 1.15rem; color: #cfd8e6; margin: 1.1rem 0 0; max-width: 34rem; }
.hero-sub { color: #93a3b8; margin: .8rem 0 0; max-width: 34rem; }
.btn.big { padding: .55rem 1rem; font-size: .85rem; } .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.hpill { border-radius: 99px; padding: .35rem .8rem; font-weight: 700; font-size: .72rem; } .hpill.a { background: #14324a; color: #9ccaf5; } .hpill.b { background: #1b2838; color: #cfd8e6; }
.hero-r { position: relative; min-height: 34rem; color: var(--ink); }
.hero .card { --surface: #fff; --ink: #121a24; --ink-2: #44515c; --line: #d3dbe0; background: #fff; color: #121a24; box-shadow: 0 24px 60px rgba(3,8,20,.55); }
.hcard1 { position: absolute; left: 8%; top: 2.5rem; width: min(30rem, 88%); transform: rotate(-2.5deg); }
.hcard2 { position: absolute; left: 0; bottom: 0; width: min(25rem, 80%); transform: rotate(1.8deg); }
.hchip { position: absolute; right: 4%; top: 0; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.hero .btn.primary { background: #1f4f9a; border-color: #1f4f9a; color: #fff; }
@media print { .top, .live, .noprint { display: none !important; } body { background: #fff; } .card { box-shadow: none; } }
/* D3 charts */
.d3wrap { position: relative; width: 100%; min-width: 0; margin-top: .5rem; }
svg.d3c { display: block; overflow: visible; font-family: "Atkinson Hyperlegible", sans-serif; }
svg.d3c text { fill: var(--ink-2); font-size: 12.5px; }
svg.d3c text.v, svg.d3c .term text.cnt { fill: var(--ink); font-weight: 700; }
svg.d3c text.lab { fill: var(--ink); font-weight: 700; font-size: 12px; }
svg.d3c text.num { fill: var(--ink); font-weight: 700; font-size: 12px; }
svg.d3c text.axl { font-size: 11px; fill: var(--ink-3); }
svg.d3c .grid line { stroke: var(--line); stroke-width: 1; }
svg.d3c line.base { stroke: var(--ink-3); stroke-width: 1; }
svg.d3c .track { stroke: var(--line); stroke-width: 3; fill: none; stroke-linecap: round; }
svg.d3c .node circle.nd { fill: var(--surface); stroke: var(--ink-3); stroke-width: 2; transition: fill .3s, stroke .3s; }
svg.d3c .node circle.nd.on { fill: var(--ai-soft); stroke: var(--c-ai); }
svg.d3c .term circle { stroke: var(--surface); stroke-width: 2; }
svg.d3c .packet { stroke: var(--surface); stroke-width: 2; } svg.d3c .packet.emerg { stroke: var(--crit); stroke-width: 3; }
svg.d3c text.em { fill: var(--crit); font-weight: 700; font-size: 11px; }
svg.d3c .lim line { stroke: var(--crit); stroke-width: 2; stroke-dasharray: 4 3; }
svg.d3c .lim text { fill: var(--crit); font-weight: 700; font-size: 11px; }
svg.d3c .area { opacity: .1; } svg.d3c .ln { fill: none; stroke-width: 2; }
svg.d3c .cross { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
svg.d3c .mk { stroke: var(--surface); stroke-width: 2; }
svg.d3c .scan { stroke: var(--c-ai); stroke-width: 2; }
svg.d3c .hit { fill: transparent; }
svg.d3c .gtrack { fill: var(--muted); }
svg.d3c .gsep { stroke: var(--surface); stroke-width: 2; } svg.d3c .gsep.last { display: none; }
svg.d3c text.gl { font-size: 12px; fill: var(--ink-3); } svg.d3c text.gl.on { fill: var(--ink); font-weight: 700; }
svg.d3c text.gtime { font-size: 11px; fill: var(--ink-2); font-family: "IBM Plex Mono", monospace; }
svg.d3c .ghead circle:not(.ring) { stroke: var(--surface); stroke-width: 2; }
svg.d3c .ghead .ring { fill: none; stroke-width: 2; opacity: 0; }
svg.d3c .ghead.live .ring { animation: gpulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.reduce svg.d3c .ghead.live .ring { animation: none; }
@keyframes gpulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(2.2); } }
.emergcard { border-left: 4px solid var(--crit); background: linear-gradient(90deg, var(--crit-soft), var(--surface) 60%); }
.step.emergstep .n { background: var(--crit); color: #fff; }
tr.emerg td:first-child { box-shadow: inset 4px 0 0 var(--crit); }
.mgrow { display: inline-block; width: 5rem; height: .55rem; border-radius: 99px; background: var(--muted); overflow: hidden; vertical-align: middle; }
.mgrow i { display: block; height: 100%; border-radius: 99px; width: 0; }
.growcard .row { align-items: center; }
.d3legend { display: flex; flex-wrap: wrap; gap: .25rem 1rem; font-size: .62rem; color: var(--ink-2); margin-top: .35rem; }
.d3legend span { display: inline-flex; align-items: center; gap: .35rem; }

<script>
(function () {
"use strict";
const D = window.CC_DATA, A = window.CC_AGENTS;
const $ = (s, r) => (r || document).querySelector(s);
const h = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => "$" + Number(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const TZ = "America/Phoenix";
const tm = (iso) => new Date(iso).toLocaleTimeString("en-US", { timeZone: TZ, hour12: false });
const dt = (iso) => new Date(iso).toLocaleString("en-US", { timeZone: TZ, month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }) + " MST";
const dshort = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const say = (t) => { $("#say").textContent = t; };
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const pref = (k, v) => { try { if (v === undefined) return store && store.getItem("cc-" + k); store && store.setItem("cc-" + k, v); } catch (e) { return null; } };

// ---------- state ----------
const S = {
  owners: D.OWNERS.map((o) => Object.assign({}, o)), pets: D.PETS.map((p) => Object.assign({}, p, { history: p.history.slice() })),
  claims: [], view: "owner", owner: "o1", claim: "4821", master: true, insurer: "northpaw",
  draft: null, log: [], corrections: [], undo: [], eval: null, reduce: false, q: "", openNotes: new Set(), autoApprove: true, ceiling: 500,
  ops: { coded: 0, handed: 0, auto: 0, emerg: 0, emergMs: [], queue: 23, errors: 0, tasks: 0, durations: [], recent: [], seq: 0, started: Date.now() },
};
const AGENTS = ["Reader", "Privacy guard", "Fact extractor", "Diagnosis matcher", "Invoice coder", "Validator", "Code reviewer", "Requirements agent", "History agent", "Router", "Packet agent", "Approval agent", "Emergency agent"];
const SECURITY = ["Bot defense", "Account security", "API integrity", "Data access audit", "Warning agent"];
const AG = {};
[...AGENTS, ...SECURITY].forEach((n) => { AG[n] = { name: n, security: SECURITY.includes(n), paused: false, run: 0, down: 0, tasks: 0, errors: 0, ms: [] }; });
// 60 days of seeded history so uptime and error rates have a baseline.
for (const a of Object.values(AG)) { const day = 864e5; a.run = 60 * day * (0.985 + rnd() * 0.014); a.down = 60 * day - a.run; a.tasks = Math.round(8000 + rnd() * 900); a.errors = Math.round(a.tasks * (0.002 + rnd() * 0.012)); for (let i = 0; i < 40; i++) a.ms.push(1 + rnd() * (a.name === "Reader" ? 1800 : 40)); }

const clinicOf = (id) => D.CLINICS[id] || { name: id, city: "", inNetwork: false };
const petOf = (id) => S.pets.find((p) => p.id === id);
const ownerOf = (id) => S.owners.find((o) => o.id === id);
const claimOf = (id) => S.claims.find((c) => c.id === id);

function log(agent, text, kind) { S.log.unshift({ t: new Date().toISOString(), agent, text, kind: kind || "info" }); S.log.length = Math.min(S.log.length, 80); }

// ---------- Emergency agent ----------
// Reads the raw note, invoice and clinic before any other agent. A flagged claim is coded first, on a fast lane
// (each step about 2.5 times faster), and goes to the front of a person's queue. It never approves, pays or denies.
const EMERG_TEXT = [[/\bemergenc/i, "note or invoice says emergency"], [/toxin|ingest|chocolate|xylitol|rodenticide|antifreeze|poison/i, "possible poisoning"], [/hit by (a )?car|\bHBC\b|trauma/i, "trauma"],
  [/dyspnea|respiratory distress|cyanos|open-mouth breathing/i, "trouble breathing"], [/collapse|unresponsive|unconscious/i, "collapse"], [/seizur/i, "seizure"], [/bloat|GDV|gastric dilatation/i, "possible bloat"],
  [/urethral obstruction|blocked cat|unable to urinate/i, "urinary blockage"], [/hemorrhag|bleeding heavily|uncontrolled bleeding/i, "heavy bleeding"], [/hospitaliz|overnight|\bICU\b|oxygen cage|transfusion/i, "hospitalized"]];
function emergencyScan(c) {
  const why = []; const txt = c.notes.map((n) => n.text).join("\n") + "\n" + (c.invoiceText || ""); const cl = clinicOf(c.clinic);
  if (c.emergencyFlag) why.push("flagged as an emergency by " + (c.emergencyFlag === true ? "a person" : c.emergencyFlag));
  if (/emergency|after-hours/i.test(cl.name)) why.push("emergency or after-hours clinic");
  for (const [re, label] of EMERG_TEXT) if (re.test(txt) && !why.includes(label)) why.push(label);
  return why;
}
function emergencyOn() { return S.master && !AG["Emergency agent"].paused; }
function fastLane(r, t0, k) {
  // Speeds up the simulated step times and rebuilds every timestamp from the start time.
  let clock = t0; for (const s of r.steps) { s.ms = Math.max(1, Math.round(s.ms * k)); clock += s.ms; s.at = new Date(clock).toISOString(); }
  r.totalMs = r.steps.reduce((a, s) => a + s.ms, 0);
  if (r.packet && r.packet.auditTrail) r.packet.auditTrail = r.steps.map((s) => ({ step: s.n + " " + s.name, agents: s.agents, at: s.at, ms: s.ms, result: s.result }));
}

function code(claim, opts) {
  const pet = petOf(claim.pet); const clinic = clinicOf(claim.clinic);
  const notes = claim.notes.map((n) => n.text).join("\n");
  const ewhy = claim.emergencyFlag === false ? [] : emergencyScan(claim); const triageMs = 140;
  const emergency = ewhy.length > 0 && emergencyOn();
  if (ewhy.length && !emergencyOn()) log("Router", "Claim " + claim.id + " looks like an emergency, but the Emergency agent is not running; it waits in the normal order.", "warn");
  const r = A.run({ note: notes, invoice: claim.invoiceText, pet, insurer: claim.insurer || "northpaw", visit: claim.visit, docType: claim.docType, paid: claim.paid,
    claimId: claim.id, clinicName: clinic.name, noteFile: claim.notes[0] && claim.notes[0].file, invoiceFile: claim.invoiceFile, notePages: claim.notes.reduce((a, n) => a + (n.pages || 1), 0), invoicePages: claim.invoicePages || 1,
    startedAt: emergency ? new Date(new Date(claim.filed).getTime() + triageMs).toISOString() : claim.filed, simulatedDurations: !!(opts && opts.sim), extraMs: opts && opts.extraMs });
  if (emergency && opts && opts.sim) fastLane(r, new Date(claim.filed).getTime() + triageMs, 0.4);
  if (emergency) {
    const ins = D.INSURERS[claim.insurer || "northpaw"]; const urgentCodes = ["Toxin ingestion", "Urethral obstruction", "Gastrointestinal foreign body", "Congestive heart failure", "Seizure", "Fracture", "Pneumonia", "Hemangiosarcoma", "Bite wound"];
    const conf = r.codes.filter((x) => x.status === "confirmed" && urgentCodes.includes(x.term)).map((x) => x.term);
    claim.emergency = { by: "Emergency agent", at: new Date(new Date(claim.filed).getTime() + triageMs).toISOString(), ms: triageMs, reasons: ewhy, confirmed: conf,
      fastTrack: ins.id === "pumpkin" && r.invoice.total >= 500 ? "Eligible for the insurer's fast track for care of $500 or more (PumpkinNow)" : null };
    if (r.routing.toPerson) r.routing.reasons.unshift("Emergency: reviewed first by the Emergency agent; this claim is at the front of your queue.");
    AG["Emergency agent"].tasks++; AG["Emergency agent"].ms.push(triageMs);
  } else claim.emergency = null;
  claim.result = r; claim.notes.forEach((n) => { n.codedAt = r.steps[1].at; });
  if (!claim.decision) claim.status = claim.docType === "estimate" && !r.routing.toPerson ? "Estimate ready" : r.routing.toPerson ? "Needs a person" : "Ready to submit";
  if (!claim.decision && !(opts && opts.noAuto)) approvalAgent(claim);
  for (const s of r.steps) for (const a of s.agents) if (AG[a]) { AG[a].tasks++; AG[a].ms.push(s.ms / s.agents.length); if (AG[a].ms.length > 200) AG[a].ms.shift(); }
  return r;
}

// Approval agent: approves the claim packet (ready to submit) only when every check passed and the total is under the limit a person set.
// It never denies, never pays, and never acts on a claim with an open question; a person can undo it.
function approvalCheck(c) {
  const r = c.result; const why = [];
  if (!S.autoApprove) why.push("Approval agent is turned off");
  if (!S.master || AG["Approval agent"].paused) why.push("Approval agent is not running");
  if (r.routing.toPerson) why.push("open questions for a person");
  if (c.docType === "estimate") why.push("estimates are filed after treatment");
  if (r.invoice.total > S.ceiling) why.push("total " + money(r.invoice.total) + " is over the " + money(S.ceiling) + " limit");
  return why;
}
function approvalAgent(c) {
  const why = approvalCheck(c); c.approvalNote = why.length ? "Approval agent did not approve: " + why.join("; ") + "." : null;
  if (why.length) return false;
  const at = new Date(new Date(c.result.steps[c.result.steps.length - 1].at).getTime() + 300).toISOString();
  c.decision = { kind: "auto", label: "Approved by the Approval agent", at, by: "Approval agent", rules: ["All 6 agent steps passed", "Every code confirmed, supported and agreed", "Every required document present", "No pre-existing or waiting-period flag", "Total " + money(c.result.invoice.total) + " at or under the " + money(S.ceiling) + " limit"] };
  c.status = "Auto-approved"; AG["Approval agent"].tasks++;
  S.undo.push({ claim: c.id, decision: null, status: "Ready to submit" });
  log("Approval agent", "Claim " + c.id + " approved: all checks passed, " + money(c.result.invoice.total) + " under the " + money(S.ceiling) + " limit.", "good");
  return true;
}

function boot() {
  for (const v of D.VISITS) {
    const c = { id: v.claim, pet: v.pet, clinic: v.clinic, visit: v.visit, filed: v.filed, paid: v.paid, docType: v.docType, insurer: "northpaw",
      notes: [{ text: v.note, file: "soap-" + v.claim + ".pdf", pages: 1, added: v.filed }], invoiceText: v.invoice, invoiceFile: (v.docType === "estimate" ? "estimate-" : "invoice-") + v.claim + ".pdf", invoicePages: 1, decision: null, events: [] };
    if (v.status && v.status.startsWith("Submitted")) { c.decision = { kind: "approved", at: v.filed, by: "Adjuster" }; }
    code(c, { sim: true, noAuto: !!c.decision });
    if (c.decision && c.decision.kind !== "auto") c.status = v.status;
    S.claims.push(c);
  }
  S.eval = A.evaluate();
  S.claims.filter((c) => /Needs/.test(c.status)).forEach((c) => S.openNotes.add(c.id));
  S.ops.coded = 412; S.ops.handed = 161; S.ops.auto = 214; S.ops.errors = 4; S.ops.tasks = 412;
  for (const c of S.claims) { S.ops.durations.push(c.result.totalMs); if (isEmerg(c)) { S.ops.emerg++; S.ops.emergMs.push(c.result.totalMs); } }
  for (let i = 0; i < 12; i++) S.ops.emergMs.push(900 + rnd() * 900);
  for (let i = 0; i < 40; i++) S.ops.durations.push(2600 + rnd() * 3000);
  for (let i = 0; i < 30; i++) { const u = rnd(); recent(u < 0.39 ? "person" : u < 0.93 ? "auto" : "ready", 2600 + rnd() * 3000, "Q-" + (7000 + i)); }
  log("Router", "Claim 4821 handed to a person: possible pre-existing condition.", "warn");
  log("Packet agent", "Claim 4630 packet produced and approved.", "good");
  if (claimOf("4862") && isEmerg(claimOf("4862"))) log("Emergency agent", "Claim 4862 flagged as an emergency (" + claimOf("4862").emergency.reasons.join(", ") + "); coded first and moved to the front of your queue.", "crit");
}

// ---------- live operations ----------
function median(a) { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; }
function p95(a) { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length * 0.95)] : 0; }
// Every coded claim is recorded once for the live charts: outcome, time to code and a label.
function recent(outcome, ms, label) { S.ops.seq++; S.ops.recent.push({ id: S.ops.seq, outcome, ms, label }); if (S.ops.recent.length > 60) S.ops.recent.shift(); return outcome; }
const isEmerg = (c) => !!(c && c.emergency);
const openEmerg = (c) => isEmerg(c) && !/Submitted/.test(c.status || "");
const queueOrder = (a, b) => (openEmerg(b) - openEmerg(a)) || b.filed.localeCompare(a.filed);
function outcomeOf(c) { return c.result.routing.toPerson ? "person" : c.decision && c.decision.by === "Approval agent" ? "auto" : "ready"; }
// Where a claim is in the process: 8 stages, the last two belong to people (or the Approval agent).
const STAGE_LABELS = ["Extract", "Match", "Validate", "Requirements", "Route", "Packet", "Approve", "Submitted"];
function progressOf(c) {
  const r = c.result, d = c.decision, rv = c.review;
  const stages = STAGE_LABELS.map((label, i) => ({ label, time: i < 6 && r.steps[i] ? tm(r.steps[i].at) : "" , who: i < 6 && r.steps[i] ? r.steps[i].agents.join(", ") : "" }));
  let done = 6, tone = r.routing.toPerson ? "warn" : "accent", now = r.routing.toPerson ? "Waiting for a person" : "Ready for an OK";
  if (rv && rv.state === "open") { done = 6.5; tone = "ai"; now = "In human review"; stages[6].time = tm(rv.at); stages[6].who = "Human reviewer"; }
  if (d && (d.kind === "approve" || d.kind === "auto" || d.kind === "approved")) { done = 7; tone = "good"; now = d.label || "Approved"; stages[6].time = tm(d.at); stages[6].who = d.by || "You"; }
  else if (d) { done = 6.5; tone = "warn"; now = d.label; stages[6].time = tm(d.at); stages[6].who = d.by || "You"; }
  if (/Submitted/.test(c.status)) { done = 8; tone = "good"; now = "Submitted to the insurer"; stages[7].time = d ? tm(d.at) : ""; }
  return { done, tone, now, stages };
}
function working() { return AGENTS.filter((n) => !AG[n].paused && S.master).length; }
function renderLive() {
  const o = S.ops, up = Object.values(AG).filter((a) => !a.security).reduce((a, b) => a + b.run, 0) / Object.values(AG).filter((a) => !a.security).reduce((a, b) => a + b.run + b.down, 0);
  const m = (k, v) => `<span class="m"><small>${k}</small><b>${v}</b></span>`;
  $("#live").innerHTML = `<span class="livetag ${S.master ? "" : "off"}"><span class="dot ${S.master ? "pulse" : ""}"></span>${S.master ? "LIVE" : "AGENTS OFF"}</span>` +
    m("Agents working", working() + " of " + AGENTS.length) + m("In queue", o.queue + " claims") + m("Coded today", o.coded) + m("Median time to code", (median(o.durations) / 1000).toFixed(1) + " s") +
    m("Auto-approved", Math.round(100 * o.auto / Math.max(1, o.coded)) + "%") + m("Handed to a person", Math.round(100 * o.handed / Math.max(1, o.coded)) + "%") +
    m("Error rate", (100 * o.errors / Math.max(1, o.tasks)).toFixed(1) + "%") + m("Uptime 60 d", (100 * up).toFixed(1) + "%") + m("Emergencies first", o.emerg + " · median " + (median(o.emergMs) / 1000).toFixed(1) + " s") + m("Security agents", "5 running") +
    `<span class="spacer"></span><span class="mono muted">Updated ${tm(new Date().toISOString())} MST · simulated feed</span>`;
}
let tickN = 0;
function tick() {
  tickN++;
  for (const a of Object.values(AG)) { const on = a.security || (S.master && !a.paused); if (on) a.run += 1000; else a.down += 1000; }
  if (S.master && tickN % 5 === 0) S.ops.queue += 1;
  if (emergencyOn() && tickN > 4 && rnd() < 0.025) {
    // An emergency claim arrives; the Emergency agent takes it ahead of everything waiting in the queue.
    const r = A.run({ note: "S: Emergency visit. Ate xylitol gum 30 minutes ago.\nO: Weak, glucose low.\nA: Toxin ingestion.\nP: IV dextrose, hospitalized overnight.", invoice: "Emergency exam 1 145.00\nIV fluids 1 210.00\nHospitalization, overnight 1 380.00\nTotal 735.00", insurer: "northpaw" });
    const ms = 900 + rnd() * 900; S.ops.coded++; S.ops.tasks++; S.ops.emerg++; S.ops.emergMs.push(ms); S.ops.durations.push(ms); S.ops.handed++; AG["Emergency agent"].tasks++;
    for (const st of r.steps) for (const a of st.agents) if (AG[a]) AG[a].tasks++;
    const id = "E-" + (8100 + S.ops.seq); recent("person", ms, id); S.ops.recent[S.ops.recent.length - 1].emergency = true;
    log("Emergency agent", "Emergency claim " + id + " (possible poisoning) jumped ahead of " + S.ops.queue + " queued claims; coded in " + (ms / 1000).toFixed(1) + " s and sent to the front of a person's queue.", "crit");
    liveCharts("person", true);
  }
  if (S.master && tickN % 6 === 0 && S.ops.queue > 0) {
    // A simulated claim arrives from the queue; the real agents code it.
    const [note] = D.GOLD[Math.floor(rnd() * D.GOLD.length)];
    const paused = AGENTS.filter((n) => AG[n].paused);
    if (!paused.length) {
      const r = A.run({ note: "S: Owner concern.\nO: Exam findings recorded.\n" + note + "\nP: Treatment as discussed.", invoice: "Exam, sick visit 1 68.00\nTotal 68.00", insurer: "northpaw" });
      S.ops.queue--; S.ops.coded++; S.ops.tasks++; S.ops.durations.push(2600 + rnd() * 2600); if (S.ops.durations.length > 400) S.ops.durations.shift();
      if (r.routing.toPerson) S.ops.handed++; else if (S.autoApprove && !AG["Approval agent"].paused) { S.ops.auto++; AG["Approval agent"].tasks++; }
      const oc = recent(r.routing.toPerson ? "person" : S.autoApprove && !AG["Approval agent"].paused ? "auto" : "ready", S.ops.durations[S.ops.durations.length - 1], "Q-" + (7100 + S.ops.seq));
      liveCharts(oc);
      for (const s of r.steps) for (const a of s.agents) if (AG[a]) AG[a].tasks++;
      if (rnd() < 0.02) { const a = AGENTS[Math.floor(rnd() * AGENTS.length)]; AG[a].errors++; S.ops.errors++; log(a, "Simulated timeout on a queued claim; retried and passed.", "crit"); }
      else log("Router", "Queued claim coded: " + (r.codes.filter((c) => c.status === "confirmed").map((c) => c.term).join(", ") || "no confirmed diagnosis") + (r.routing.toPerson ? " · handed to a person" : " · ready"), r.routing.toPerson ? "warn" : "good");
    } else if (tickN % 30 === 0) log("Router", "Queue waiting: " + paused.join(", ") + " paused.", "warn");
  }
  renderLive();
  if (location.hash.startsWith("#agents") && !document.activeElement.closest("#view button")) renderAgentsTable();
  if (location.hash.startsWith("#agents") && CH.errors && tickN % 3 === 0) CH.errors.update(errorRows());
}

// ---------- shared pieces ----------
function stepper(c, live) {
  const r = c.result; const out = [];
  const lab = ["Extract facts", "Match codes", "Validate", "Requirements", "Route", "Claim packet"];
  if (isEmerg(c)) out.push(`<div class="step done emergstep"><span class="n">E</span><div><b>Emergency review</b><span class="mono">${tm(c.emergency.at)} · ${c.emergency.ms} ms</span><small>Emergency agent: first in line</small></div></div>`);
  r.steps.forEach((s, i) => {
    const warn = (i === 2 && r.codes.some((x) => !x.review.agree || !x.validation.supported)) || (i === 3 && (r.history.flags.length || r.requirements.some((q) => q.required && !q.ok))) || (i === 4 && r.routing.toPerson);
    out.push(`<div class="step ${warn ? "warn" : "done"}"><span class="n">${warn ? "!" : "✓"}</span><div><b>${s.n} ${lab[i]}</b><span class="mono">${tm(s.at)} · ${s.ms < 1000 ? s.ms + " ms" : (s.ms / 1000).toFixed(1) + " s"}</span><small>${h(s.agents.join(", "))}</small></div></div>`);
  });
  const d = c.decision;
  out.push(`<div class="step ${d ? "done" : "now"}"><span class="n">${d ? "✓" : "7"}</span><div><b>7 Approve</b><span class="mono">${d ? tm(d.at) : "waiting"}</span><small>${d ? h(d.by === "Approval agent" ? "Approval agent" : (d.by || "You") + ": " + (d.label || "Approved")) : c.review && c.review.state === "open" ? "In human review" : r.routing.toPerson ? "Handed back to you" : "Ready for your OK"}</small></div></div>`);
  out.push(`<div class="step next"><span class="n">8</span><div><b>8 Submitted</b><span class="mono">${/Submitted/.test(c.status) ? "done" : "—"}</span><small>Packet to the insurer</small></div></div>`);
  return `<div class="stepper" role="list" aria-label="Claim steps">${out.join("")}</div>`;
}

function emergPill(c) { return isEmerg(c) ? `<span class="pill crit" title="${h(c.emergency.reasons.join(", "))}"><span class="dot"></span>Emergency · first</span>` : ""; }
function networkPill(c) { const cl = clinicOf(c.clinic); const ins = D.INSURERS[c.insurer || "northpaw"];
  if (!ins.directPayNetwork) return `<span class="pill muted">Network: not used by this insurer</span>`;
  return cl.inNetwork ? `<span class="pill good" title="Direct pay to the clinic is possible"><span class="dot"></span>In network</span>` : `<span class="pill warn" title="Owner pays and is reimbursed"><span class="dot"></span>Out of network</span>`; }

function statusPill(c) { const s = c.status || ""; const k = /Needs/.test(s) ? "warn" : /Submitted|Approved|approved|Ready/.test(s) ? "good" : /Records/.test(s) ? "accent" : /Estimate|review/.test(s) ? "ai" : "muted"; return `<span class="pill ${k}">${h(s)}</span>`; }

function deductible(pet) { if (!pet) return ""; const left = Math.max(0, pet.deductible - pet.deductibleMet);
  const renew = (() => { const s = new Date(pet.coverageStart + "T12:00:00"), n = new Date(); const r = new Date(n.getFullYear(), s.getMonth(), s.getDate(), 12); if (r <= n) r.setFullYear(r.getFullYear() + 1); return r.toISOString().slice(0, 10); })();
  return `<div class="banner ${left > 0 ? "ai" : "good"} small"><b>Deductible reminder:</b> yearly deductible of ${money(pet.deductible)}, ${money(pet.deductibleMet)} met this policy year · <b>${money(left)} left</b>. It resets on ${dshort(renew)}. The insurer applies it before any reimbursement. <b>Plan cap: unlimited</b> (no annual or lifetime payout limit).</div>`; }

function timeline(c) {
  const pet = petOf(c.pet), ins = c.result.insurer, hst = c.result.history; if (!pet) return "";
  const cov = pet.coverageStart, waitEnd = A.addDays(cov, ins.waitingDays), look = ins.lookbackMonths ? A.addMonths(cov, -ins.lookbackMonths) : null;
  const dates = [cov, waitEnd, c.visit, ...(pet.history.map((x) => x.date)), look].filter(Boolean).sort();
  const lo = A.addDays(dates[0], -30), hi = A.addDays(dates[dates.length - 1], 30), span = A.days(lo, hi), W = 560;
  const X = (d) => 20 + (A.days(lo, d) / span) * (W - 40);
  const flags = hst.flags.filter((f) => f.type === "preexisting");
  let s = `<svg viewBox="0 0 ${W} 146" role="img" aria-label="Pre-existing condition time frame for ${h(pet.name)}">`;
  if (look) s += `<rect x="${X(look)}" y="62" width="${X(cov) - X(look)}" height="14" rx="3" fill="var(--warn-soft)"/>`;
  else s += `<rect x="20" y="62" width="${X(cov) - 20}" height="14" rx="3" fill="var(--warn-soft)"/>`;
  s += `<rect x="${X(cov)}" y="62" width="${Math.max(3, X(waitEnd) - X(cov))}" height="14" fill="var(--muted)"/><rect x="${X(waitEnd)}" y="62" width="${W - 20 - X(waitEnd)}" height="14" rx="3" fill="var(--good-soft)"/>`;
  s += `<line x1="${X(cov)}" x2="${X(cov)}" y1="50" y2="92" stroke="var(--ink)" stroke-width="2"/><text x="${X(cov) + 5}" y="106" class="b">Coverage starts</text><text x="${X(cov) + 5}" y="130">${dshort(cov)}</text>`;
  if (look && X(cov) - X(look) > 150) s += `<text x="${X(look)}" y="106">Look-back starts</text><text x="${X(look)}" y="130">${dshort(look)}</text>`;
  pet.history.forEach((x, i) => { const flagged = flags.some((f) => f.date === x.date); s += `<rect x="${X(x.date) - 6}" y="63" width="12" height="12" transform="rotate(45 ${X(x.date)} 69)" fill="${flagged ? "var(--warn)" : "var(--ink-3)"}"/><text x="${X(x.date)}" y="18" text-anchor="middle" class="b">Prior visit</text><text x="${X(x.date)}" y="40" text-anchor="middle">${dshort(x.date)}</text>`; });
  s += `<circle cx="${X(c.visit)}" cy="69" r="7" fill="var(--accent)"/><text x="${X(c.visit)}" y="18" text-anchor="end" class="b">This visit</text><text x="${X(c.visit)}" y="40" text-anchor="end">${dshort(c.visit)}</text></svg>`;
  return `<div class="card"><div class="eyebrow warn">Pre-existing condition time frame · History agent</div><h3 style="margin:.2rem 0 .3rem">${flags.length ? "Signs found before coverage started" : "No earlier signs found for these codes"}</h3>
    <div class="chart">${s}</div>
    <div class="row small"><span class="pill warn">${look ? ins.lookbackMonths + "-month look-back" : "Any time before coverage"}</span><span class="pill muted">${ins.waitingDays}-day waiting period</span><span class="pill good">Covered period</span></div>
    ${flags.map((f) => `<p class="small" style="margin:.4rem 0 0"><b>${h(f.text)}</b> · ${f.gap} days before this visit. ${h(f.detail)}</p>`).join("")}
    <p class="small muted" style="margin:.4rem 0 0">${h(ins.name)} rule: ${h(ins.preexistingRule)} The History agent flags; only a person decides.</p></div>`;
}

function highlight(text, codes) {
  let html = h(text);
  for (const c of codes) { const t = h(c.evidence.text); if (!t) continue; const i = html.indexOf(t); if (i < 0) continue;
    html = html.slice(0, i) + `<mark class="${c.status === "suspected" ? "sus" : ""}" data-code="${c.id}" id="ev-${c.id}">${t}</mark>` + html.slice(i + t.length); }
  return html;
}

function soapCard(c) {
  const r = c.result; const sec = r.sections; const names = { S: "Subjective", O: "Objective", A: "Assessment", P: "Plan" };

  ${r.facts.patient ? `<p class="small" style="margin:.4rem 0 0"><b>Patient:</b> ${h(r.facts.patient)} · <b>Visit:</b> ${h(r.facts.visitDate || c.visit)} · <b>Attending veterinarian:</b> as signed on the SOAP note</p>` : ""}
  ${["S", "O", "A", "P"].filter((k) => sec[k]).map((k) => `<div class="sec"><span class="l">${k}</span><div><div class="eyebrow">${names[k]}</div><div>${k === "A" ? highlight(sec[k], r.codes) : h(sec[k])}</div></div></div>`).join("")}

function codesCard(c) {

    return `<div class="code"><span class="num pill ${conf ? "good" : "muted"}">${conf ? i : "–"}</span><div><b>${h(x.term)}</b> <span class="small muted">${h(x.id)} · ${h(x.system)}</span>
    <div class="small">${conf ? "" : "<b>Suspected, not billed.</b> "}${h(x.def)}</div>
    <details><summary>Evidence trail</summary><dl class="trail"><dt>Supporting text</dt><dd>"${h(x.evidence.text)}" <button class="btn small" data-act="jump" data-code="${x.id}">Show in note</button></dd><dt>Document, page</dt><dd>${h(x.evidence.doc)}, page ${x.evidence.page}, ${h(x.evidence.section)}</dd><dt>Coding system</dt><dd>${h(D.VOCAB_VERSION)}</dd><dt>Status</dt><dd>${conf ? "Confirmed" : "Suspected"}</dd><dt>Matched on</dt><dd>${h(x.via)} · ${Math.round(x.score * 100)}%</dd><dt>Validator</dt><dd>${h(x.validation.reason)}</dd><dt>Code reviewer</dt><dd>${h(x.review.says)}: ${h(x.review.why)}</dd>${x.alternatives.length ? `<dt>Other candidates</dt><dd>${x.alternatives.map((a) => h(a.term)).join(", ")}</dd>` : ""}</dl></details>
    ${c.decision ? "" : `<div class="row" style="margin-top:.3rem"><label class="small muted" for="ed-${x.id}">Change to</label><select id="ed-${x.id}" data-act="editcode" data-code="${x.id}" style="width:auto">${[`<option value="">Keep ${h(x.term)}</option>`, ...D.VOCAB.filter((v) => v.id !== x.id && (v.system === x.system || x.alternatives.some((a) => a.id === v.id))).map((v) => `<option value="${v.id}">${h(v.term)}</option>`), `<option value="__remove">Remove this code</option>`, conf ? `<option value="__sus">Mark as suspected</option>` : `<option value="__conf">Mark as confirmed</option>`].join("")}</select></div>`}
    </div><span class="pill ${k}">${conf ? (x.score >= 0.9 ? "High" : x.score >= 0.8 ? "Medium" : "Low") : "Not billed"}</span></div>`; };

    ${r.codes.length ? r.codes.slice().sort((a, b) => (a.status === "confirmed" ? 0 : 1) - (b.status === "confirmed" ? 0 : 1)).map((x) => item(x, x.status === "confirmed" ? ++i : 0)).join("") : `<p class="small">No diagnosis matched. The claim goes to a person.</p>`}${rev}</div>`;
}

function invoiceCard(c) {

const CH = {};
function systemRows(claims) {
  const m = new Map();
  for (const c of claims) for (const x of c.result.codes) { const k = x.system || "Other"; const r = m.get(k) || { system: k, confirmed: 0, suspected: 0, terms: [] }; x.status === "confirmed" ? r.confirmed++ : r.suspected++; if (!r.terms.includes(x.term)) r.terms.push(x.term); m.set(k, r); }
  return [...m.values()].sort((a, b) => (b.confirmed + b.suspected) - (a.confirmed + a.suspected) || a.system.localeCompare(b.system));
}
function ganttRows(c) {
  const r = c.result; const lab = ["1 Extract facts", "2 Match codes", "3 Validate", "4 Requirements", "5 Route", "6 Claim packet"]; let t = 0;
  const pre = []; if (isEmerg(c)) { pre.push({ label: "E Emergency", agents: "Emergency agent", start: 0, ms: c.emergency.ms, warn: false, kind: "emergency" }); t = c.emergency.ms; }
  const rows = pre.concat(r.steps.map((s, i) => { const warn = (i === 2 && r.codes.some((x) => !x.review.agree || !x.validation.supported)) || (i === 3 && (r.history.flags.length || r.requirements.some((q) => q.required && !q.ok))) || (i === 4 && r.routing.toPerson);
    const row = { label: lab[i], agents: s.agents.join(", "), start: t, ms: Math.max(1, s.ms), warn: !!warn, kind: "agent" }; t += s.ms; return row; }));
  if (c.decision && c.decision.by === "Approval agent") rows.push({ label: "7 Approve", agents: "Approval agent", start: t, ms: 300, warn: false, kind: "approve" });
  return rows;
}

const loaded = {};
function loadScript(src) { return loaded[src] || (loaded[src] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Could not load " + src)); document.head.appendChild(s); })); }
async function ocrImage(src, status) {
  await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  const r = await window.Tesseract.recognize(src, "eng", { logger: (m) => { if (m.status === "recognizing text") status("OCR " + Math.round(m.progress * 100) + "%"); } });
  return { text: r.data.text, conf: Math.round(r.data.confidence) };
}
async function readFile(file, status) {
  if (/pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)) {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise; let text = "", conf = 100, ocrPages = 0;
    for (let i = 1; i <= pdf.numPages; i++) {
      status("Reading page " + i + " of " + pdf.numPages);
      const page = await pdf.getPage(i); const tc = await page.getTextContent();
      let lines = {}; tc.items.forEach((it) => { const y = Math.round(it.transform[5]); (lines[y] = lines[y] || []).push(it.str); });
      const pt = Object.keys(lines).sort((a, b) => b - a).map((y) => lines[y].join(" ").trim()).filter(Boolean).join("\n");
      if (pt.replace(/\s/g, "").length > 30) { text += pt + "\n"; continue; }
      const vp = page.getViewport({ scale: 2 }); const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise; const o = await ocrImage(cv, (s) => status("Page " + i + ": " + s)); text += o.text + "\n"; conf = Math.min(conf, o.conf); ocrPages++;
    }
    return { text: text.trim(), pages: pdf.numPages, how: ocrPages ? "OCR on " + ocrPages + " scanned page" + (ocrPages > 1 ? "s" : "") + ", " + conf + "% confidence" : "text layer read, 100% exact", conf };
  }
  if (/heic|heif/i.test(file.type + file.name)) throw new Error("HEIC photos cannot be read in this browser. Export as JPG or PNG.");
  const o = await ocrImage(file, status); return { text: o.text.trim(), pages: 1, how: "OCR " + o.conf + "% confidence", conf: o.conf };
}
async function handleFile(kind, file) {
  const d = S.draft; const st = $(kind === "note" ? "#stNote" : "#stInv"); const set = (t) => { if (st) st.textContent = file.name + " · " + t; };
  if (!S.master || AG.Reader.paused) { set("Reader is off. Turn agents on to read files."); return; }
  set("Reader started"); log("Reader", "Reading " + file.name, "info");
  try { const r = await readFile(file, set);
    if (kind === "note") { d.note = r.text; d.noteFile = file.name; d.notePages = r.pages; d.ocrNote = r.how; d.ocrConf = r.conf; }
    else { d.invoice = r.text; d.invoiceFile = file.name; d.invoicePages = r.pages; d.ocrInv = r.how; }
    route(); say(file.name + " read: " + r.how); log("Reader", file.name + " read: " + r.how, "good");
  } catch (e) { set("Could not read: " + e.message); AG.Reader.errors++; log("Reader", file.name + ": " + e.message, "crit"); }
}

  { pet: "p3", clinic: "kierland", visit: "2026-10-22", docType: "invoice", paid: true, note: D.VISITS[4].note.replace("10/21/2026", "10/22/2026"), invoice: D.VISITS[4].invoice, noteFile: "miso-soap.png", invoiceFile: "receipt-paid.pdf" },
  { pet: "p4", clinic: "kierland", visit: "2026-10-22", docType: "estimate", paid: false, note: D.VISITS[5].note, invoice: D.VISITS[5].invoice, noteFile: "bruno-ortho.pdf", invoiceFile: "tplo-estimate.pdf" },

async function runAgents() {
  const d = S.draft; if (!S.master) return;
  const paused = AGENTS.filter((n) => AG[n].paused); const out = $("#runOut");
  if (!d.note.trim()) { out.innerHTML = `<div class="banner warn small">Add a SOAP note first: upload a file or paste the text.</div>`; return; }
  if (paused.length) { out.innerHTML = `<div class="banner warn small">Paused: ${paused.map(h).join(", ")}. Resume them on the Agents screen to run the pipeline.</div>`; return; }
  const now = new Date().toISOString(); let c;
  if (d.addTo) { c = claimOf(d.addTo); c.notes.push({ text: d.note, file: d.noteFile || "pasted-note.txt", pages: d.notePages || 1, added: now }); c.decision = null; }
  else { const id = String(4900 + S.claims.length); c = { id, pet: d.pet, clinic: d.clinic, visit: d.visit, filed: now, paid: d.paid, docType: d.docType, insurer: d.insurer, emergencyFlag: d.emergency ? true : undefined, notes: [{ text: d.note, file: d.noteFile || "pasted-note.txt", pages: d.notePages || 1, added: now }], invoiceText: d.invoice, invoiceFile: d.invoiceFile || "pasted-lines.txt", invoicePages: d.invoicePages || 1, decision: null, events: [] }; if (d.ocrConf) c.ocr = d.ocrConf; }
  c.filed = d.addTo ? c.filed : now;
  const r = code(c, { extraMs: { 1: d.ocrConf ? 0 : 0 } });
  if (!d.addTo) S.claims.push(c);
  S.ops.coded++; S.ops.tasks++; S.ops.durations.push(r.totalMs); if (r.routing.toPerson) S.ops.handed++; if (c.decision && c.decision.by === "Approval agent") S.ops.auto++;
  recent(outcomeOf(c), r.totalMs, c.id); if (isEmerg(c)) { S.ops.recent[S.ops.recent.length - 1].emergency = true; S.ops.emerg++; S.ops.emergMs.push(r.totalMs); log("Emergency agent", "Claim " + c.id + " flagged as an emergency (" + c.emergency.reasons.join(", ") + "); reviewed first.", "crit"); }
  const lab = ["Extract facts", "Match codes", "Validate", "Insurer requirements", "Route", "Claim packet"];

  S.draft = null; S.claim = c.id; location.hash = "#review/" + c.id; say("Agents finished claim " + c.id);
}

// ---------- decisions ----------
function decide(kind) {
  const c = claimOf(S.claim); const prev = { claim: c.id, decision: c.decision, status: c.status };
  const label = { approve: "Packet approved, ready to submit", records: "Records requested from the clinic", takeover: "Taken over by you" }[kind];
  c.decision = { kind, label, at: new Date().toISOString(), by: "You" }; c.status = { approve: "Approved", records: "Records requested", takeover: "With you" }[kind];
  S.undo.push(prev); S.corrections.push({ claim: c.id, at: c.decision.at, text: "Decision: " + label + " (labeled example)" });
  log("You", "Claim " + c.id + ": " + label, "good"); say(label); route();
}
function editCode(codeId, to) {
  const c = claimOf(S.claim); const x = c.result.codes.find((k) => k.id === codeId); if (!x || !to) return;
  const before = x.term + " (" + x.status + ")";
  if (to === "__remove") c.result.codes = c.result.codes.filter((k) => k.id !== codeId);
  else if (to === "__sus") x.status = "suspected"; else if (to === "__conf") x.status = "confirmed";
  else { const v = D.VOCAB.find((k) => k.id === to); Object.assign(x, { id: v.id, term: v.term, system: v.system, def: v.def, via: "changed by a person", score: 1, review: { agree: true, says: "Changed by a person", why: "A person chose this code." } }); x.validation = { supported: true, reason: "Chosen by a person." }; }
  const t = before + " → " + (to === "__remove" ? "removed" : (c.result.codes.find((k) => k.id === (to.startsWith("__") ? codeId : to)) || {}).term + (to === "__sus" ? " (suspected)" : ""));
  S.corrections.push({ claim: c.id, at: new Date().toISOString(), text: "Code change: " + t + " (labeled example for the eval set)" });
  c.result.packet.diagnosisCodes = c.result.codes.map((k) => ({ id: k.id, term: k.term, status: k.status, supportingText: k.evidence.text, document: k.evidence.doc, page: k.evidence.page, section: k.evidence.section, codingSystem: D.VOCAB_VERSION, confidence: k.score, validation: k.validation.reason, reviewer: k.review.says }));
  log("You", "Claim " + c.id + " code change: " + t, "warn"); say("Code changed: " + t); route();
}
function setMaster(on) {
  if (on && !confirm("Turn all agents back on?")) return;
  if (!on && !confirm("Turn off all agents now? Claims in progress keep their state. Security agents keep running.")) return;
  S.master = on; const b = $("#master"); b.className = "switch " + (on ? "on" : "off"); b.setAttribute("aria-pressed", on); b.innerHTML = (on ? "All agents on" : "All agents off") + " <i></i>";
  log("Master shutoff", on ? "All agents turned on by a person." : "All agents turned off by a person.", on ? "good" : "crit"); say(on ? "All agents on" : "All agents off"); renderLive(); route();
}
function stopAll() { if (!S.master) return; S.master = false; const b = $("#master"); b.className = "switch off"; b.setAttribute("aria-pressed", "false"); b.innerHTML = "All agents off <i></i>"; log("Stop all", "Everything stopped. Security agents keep running.", "crit"); say("Stopped. Nothing else will change."); renderLive(); route(); }

// ---------- events ----------
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return; const a = t.dataset.act;
  if (a === "notes") { e.stopPropagation(); const id = t.dataset.id; S.openNotes.has(id) ? S.openNotes.delete(id) : S.openNotes.add(id); route(); return; }
  if (a === "viewby") { S.view = t.dataset.v; route(); }
  else if (a === "owner") { S.owner = t.dataset.id; route(); }
  else if (a === "open") { location.hash = "#review/" + t.dataset.id; }
  else if (a === "jump") { const m = document.getElementById("ev-" + t.dataset.code); if (m) { m.scrollIntoView({ behavior: S.reduce ? "auto" : "smooth", block: "center" }); m.classList.add("flash"); setTimeout(() => m.classList.remove("flash"), 1500); } }

  else if (a === "master") setMaster(!S.master);
  else if (a === "stopall") stopAll();
  else if (a === "pause") { const g = AG[t.dataset.a]; g.paused = !g.paused; log(g.name, g.paused ? "Paused by a person." : "Resumed by a person.", g.paused ? "warn" : "good"); renderAgentsTable(); renderLive(); }
  else if (a === "autoapprove") { S.autoApprove = !S.autoApprove; log("Approval agent", S.autoApprove ? "Turned on by a person (limit " + money(S.ceiling) + ")." : "Turned off by a person. Every claim waits for a person.", S.autoApprove ? "good" : "warn"); route(); }
  else if (a === "reeval") { S.eval = A.evaluate(); route(); say("Accuracy recomputed"); }
  else if (a === "sample") { const s = SAMPLES[+t.dataset.s]; Object.assign(S.draft, { emergency: false }, JSON.parse(JSON.stringify(s)), { ocrNote: "sample text", ocrInv: "sample text", ocrConf: null, addTo: null }); route(); }
  else if (a === "doctype") { const v = t.dataset.v; S.draft.docType = v === "estimate" ? "estimate" : "invoice"; S.draft.paid = v === "paid"; route(); }
  else if (a === "runagents") runAgents();

  else if (a === "emergflag") { const c = claimOf(t.dataset.id); const off = !!t.dataset.off; c.emergencyFlag = off ? false : true; const keep = c.decision; c.decision = keep && keep.by === "Approval agent" ? null : keep; if (!c.decision) c.status = ""; code(c, { sim: true, noAuto: !!c.decision });
    S.corrections.push({ claim: c.id, at: new Date().toISOString(), text: (off ? "A person removed the emergency flag" : "A person flagged the claim as an emergency") + " (labeled example)" });
    log(off ? "You" : "Emergency agent", off ? "Claim " + c.id + ": emergency flag removed; back in the normal order." : "Claim " + c.id + " flagged as an emergency by a person; reviewed first and moved to the front of the queue.", off ? "info" : "crit"); route(); }
  else if (a === "humanreview") { const c = claimOf(t.dataset.id || S.claim); const at = new Date().toISOString(); const from = c.decision && c.decision.by === "Approval agent" ? "Approval agent's" : null;
    S.undo.push({ claim: c.id, decision: c.decision, status: c.status, review: null }); c.review = { state: "open", at, by: "You", from }; c.decision = null; c.status = "In human review";
    S.corrections.push({ claim: c.id, at, text: "Sent to human review" + (from ? " (Approval agent's approval set aside)" : "") + " (labeled example)" });
    log("You", "Claim " + c.id + " sent to human review." + (from ? " The Approval agent's approval is set aside until the review is done." : ""), "warn"); say("Claim " + c.id + " sent to human review"); route(); }
  else if (a === "reviewdone") { const c = claimOf(t.dataset.id || S.claim); const at = new Date().toISOString();
    S.undo.push({ claim: c.id, decision: null, status: c.status, review: Object.assign({}, c.review) }); c.review.state = "done"; c.review.doneAt = at;
    c.decision = { kind: "approve", label: "Approved after human review", at, by: "Human reviewer" }; c.status = "Approved";
    S.corrections.push({ claim: c.id, at, text: "Human review completed, packet approved (labeled example)" }); log("Human reviewer", "Claim " + c.id + " reviewed and approved, ready to submit.", "good"); say("Human review complete"); route(); }
  else if (a === "font") { const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 150; const n = Math.min(250, Math.max(100, cur + 25 * +t.dataset.d)); document.documentElement.style.setProperty("--fs", n + "%"); pref("fs", n); }
  else if (a === "theme") { const dk = document.documentElement.dataset.theme !== "dark"; document.documentElement.dataset.theme = dk ? "dark" : "light"; pref("theme", dk ? "dark" : "light"); themeLabel(); }
  else if (a === "motion") { S.reduce = !S.reduce; document.body.classList.toggle("reduce", S.reduce); t.textContent = S.reduce ? "Motion off" : "Motion on"; t.setAttribute("aria-pressed", String(!S.reduce)); pref("motion", S.reduce ? "off" : "on"); }
  else if (a === "addowner") { $("#ownerForm").innerHTML = `<div class="row" style="margin-top:.4rem"><input type="text" id="newOwner" placeholder="Owner name" style="flex:1"><button class="btn small primary" data-act="saveowner">Add</button></div>`; $("#newOwner").focus(); }
  else if (a === "saveowner") { const n = $("#newOwner").value.trim(); if (!n) return; const id = "o" + (S.owners.length + 1); S.owners.push({ id, name: n, city: "Arizona", policy: "NPM-" + (20700 + S.owners.length) }); S.owner = id; route(); }
  else if (a === "addpet") { $("#petForm").innerHTML = `<div class="row" style="margin-top:.5rem"><input type="text" id="npName" placeholder="Name" style="flex:1"><select id="npSp" style="width:auto"><option value="dog">Dog</option><option value="cat">Cat</option></select><input type="text" id="npBreed" placeholder="Breed" style="flex:1"><button class="btn small primary" data-act="savepet">Add animal</button></div>`; $("#npName").focus(); }
  else if (a === "savepet") { const n = $("#npName").value.trim(); if (!n) return; S.pets.push({ id: "p" + (S.pets.length + 1), owner: S.owner, name: n, species: $("#npSp").value, breed: $("#npBreed").value.trim() || "mixed", age: 1, coverageStart: new Date().toISOString().slice(0, 10), deductible: 250, deductibleMet: 0, history: [] }); route(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") stopAll(); if (e.key === "Enter" && e.target.matches("tr.click")) location.hash = "#review/" + e.target.dataset.id; });
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.act === "ceiling") { S.ceiling = +t.value; log("Approval agent", "Limit set to " + money(S.ceiling) + " by a person.", "info"); route(); }
  if (t.dataset.act === "pick") location.hash = "#review/" + t.value;

  if (t.dataset.bind && S.draft) { S.draft[t.dataset.bind] = t.value; if (t.dataset.bind === "pet" || t.dataset.bind === "clinic" || t.dataset.bind === "insurer") route(); }
  if (t.dataset.file && t.files[0]) handleFile(t.dataset.file, t.files[0]);
});
document.addEventListener("input", (e) => { const t = e.target; if (t.dataset.act === "search") { S.q = t.value; const pos = t.selectionStart; route(); const n = $("#ownerSearch"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } return; } if (t.dataset.bind && S.draft && t.tagName === "TEXTAREA") S.draft[t.dataset.bind] = t.value; });
document.addEventListener("dragover", (e) => { const z = e.target.closest("[data-drop]"); if (z) { e.preventDefault(); z.classList.add("over"); } });

window.ClaimsCoder = {
  state: () => ({ master: S.master, claims: S.claims.map((c) => ({ id: c.id, pet: petOf(c.pet).name, status: c.status, emergency: isEmerg(c) ? c.emergency.reasons : false, codes: c.result.codes.map((x) => x.term + " (" + x.status + ")") })) }),
  claim: (id) => { const c = claimOf(id); return c ? c.result.packet : null; },

  master: (on) => { if (on) return { status: "refused", reason: "Turning agents on needs a person." }; stopAll(); return { status: "off" }; },
  stop: () => { stopAll(); return { status: "stopped" }; },
  health: () => Object.values(AG).map((a) => ({ agent: a.name, running: a.security || (S.master && !a.paused), uptime: +(a.run / (a.run + a.down)).toFixed(4), tasks: a.tasks, errorRate: +(a.errors / Math.max(1, a.tasks)).toFixed(4), p95ms: Math.round(p95(a.ms)) })),

// ---------- start ----------
